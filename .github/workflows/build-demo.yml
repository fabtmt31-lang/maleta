# Construit La Maleta Occitana :
#   - demo Windows : MaletaOccitana-Demo.exe (un seul fichier, rien a installer)
#   - demo Linux   : maleta-occitana-demo_<version>_all.deb (Debian 12+ / Ubuntu 22.04+)
#   - borne        : maleta-occitana-v<version>.zip (version standard, install.sh)
#
# Chaque push publie les deux fichiers dans la pre-release « demo-latest »
# (page Releases du depot). Un tag v* (ex. v1.2) publie une release definitive.
name: Build demo

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r desktop/requirements.txt pytest
      - run: python -m pytest -q tests

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependances
        run: pip install -r desktop/requirements.txt pyinstaller==6.11.1
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/maleta-demo.spec
      - name: Verification de l'executable (serveur puis vraie fenetre)
        shell: pwsh
        run: |
          foreach ($mode in @("1", "gui")) {
            $env:MALETA_SMOKE_TEST = $mode
            $env:MALETA_DATA_DIR = "$env:RUNNER_TEMP\maleta-smoke-$mode"
            $p = Start-Process -FilePath dist\MaletaOccitana-Demo.exe -PassThru
            $finished = $p.WaitForExit(150000)
            if (-not $finished) { Stop-Process -Id $p.Id -Force }
            Write-Host "===== smoke $mode : journal ====="
            Get-Content "$env:MALETA_DATA_DIR\maleta-demo.log" -ErrorAction SilentlyContinue
            Write-Host "===== smoke $mode : plantages ====="
            Get-Content "$env:MALETA_DATA_DIR\maleta-demo-crash.log" -ErrorAction SilentlyContinue
            if (-not $finished) { throw "smoke $mode : bloque (aucune reponse en 150 s)" }
            if ($p.ExitCode -ne 0) { throw "smoke $mode : code $($p.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/MaletaOccitana-Demo.exe

  linux-deb:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Version la plus ancienne visee (Ubuntu 22.04) : les dependances
          # embarquees sont choisies pour elle et restent valables au-dessus.
          python-version: "3.10"
      - name: Paquet .deb
        run: bash packaging/build_deb.sh
      - name: Verification du paquet (installation + demarrage)
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/maleta-occitana-demo_*_all.deb
          sudo apt-get install -y xvfb
          MALETA_SMOKE_TEST=1 MALETA_DATA_DIR="$RUNNER_TEMP/maleta-smoke" maleta-occitana-demo
          MALETA_SMOKE_TEST=gui MALETA_DATA_DIR="$RUNNER_TEMP/maleta-smoke-gui" timeout 150 xvfb-run -a maleta-occitana-demo \
            || { cat "$RUNNER_TEMP/maleta-smoke-gui/maleta-demo.log"; exit 1; }
          cat "$RUNNER_TEMP/maleta-smoke-gui/maleta-demo.log"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb

  # Version standard (borne, petit PC Debian) : archive a installer avec
  # install.sh, comme les archives livrees jusqu'ici.
  borne-zip:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive maleta-occitana-v<version>.zip
        run: bash packaging/build_prod_zip.sh
      - name: Verification (dependances de la borne, demarrage, import)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev build-essential swig libpcsclite-dev
          mkdir -p "$RUNNER_TEMP/borne" && unzip -q dist/maleta-occitana-v*.zip -d "$RUNNER_TEMP/borne"
          cd "$RUNNER_TEMP/borne/maleta-occitana"
          python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python run_pc.py > serveur.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:5000/admin/login && break; sleep 1; done
          curl -sf http://127.0.0.1:5000/ | grep -q "Tria un"
          .venv/bin/python importer_contenu.py "$GITHUB_WORKSPACE/maleta-contenu-demo.zip"
          .venv/bin/python importer_contenu.py "$GITHUB_WORKSPACE"/docs/modeles-csv/*.csv
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: borne-zip
          path: dist/maleta-occitana-v*.zip

  release:
    needs: [windows-exe, linux-deb, borne-zip]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "La Maleta Occitana $GITHUB_REF_NAME — démo" \
              --notes "Démo : MaletaOccitana-Demo.exe (Windows 10/11) et paquet .deb (Debian 12+ / Ubuntu 22.04+). Borne (version standard) : maleta-occitana-v*.zip, à installer avec install.sh. Voir le README."
          else
            gh release delete demo-latest --yes --cleanup-tag || true
            gh release create demo-latest dist/* --prerelease --target "$GITHUB_SHA" \
              --title "Démo — dernière version (${GITHUB_REF_NAME})" \
              --notes "Construite automatiquement depuis la branche ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Démo : MaletaOccitana-Demo.exe (Windows 10/11), paquet .deb (Debian 12+ / Ubuntu 22.04+). Borne (version standard) : maleta-occitana-v*.zip, à décompresser dans ~ puis sudo bash install.sh."
          fi
